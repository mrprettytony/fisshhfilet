<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="google" content="notranslate">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Helvetica,Arial,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:99;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{font-size:16px;letter-spacing:0.5em;font-weight:300}
.main{margin-top:70px;width:100%;display:flex;flex-direction:column;align-items:center}
.wide-card{width:100vw;max-width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#111}
.wide-card img{width:100%;height:100%;object-fit:cover}
.wide-text{position:absolute;top:20px;left:20px;font-size:28px;letter-spacing:0.1em;font-weight:300}
.upload-bar{display:flex;gap:10px;padding:16px;background:#000;width:100%;justify-content:center;border-top:1px solid #222}
.upload-btn{background:#fff;color:#000;border:0;padding:12px 22px;font-size:10px;letter-spacing:0.2em;border-radius:999px;font-weight:700}
input[type=file]{position:absolute;left:-9999px;opacity:0.01}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0}
</style>
</head>
<body>
<div class="header"><div class="logo">FISSHHFILET</div><div style="font-size:10px;opacity:0.5">● LIVE</div></div>

<div class="main">
<div class="wide-card" id="galleryCard">
<div class="wide-text">jackpot</div>
<img id="previewImg" src="https://images.unsplash.com/photo-1544148103-00e3bf7a6dca?q=80&w=1200" style="display:block">
</div>

<div class="upload-bar">
<label for="photoInput" class="upload-btn">UPLOAD PHOTO GALLERY</label>
<label for="videoInput" class="upload-btn" style="background:#222;color:#fff;border:1px solid #333">UPLOAD VIDEO 1-5 MIN</label>
<input type="file" id="photoInput" accept="image/*">
<input type="file" id="videoInput" accept="video/*">
</div>
<div id="status" style="font-size:9px;opacity:0.4;padding:10px;letter-spacing:0.2em;text-align:center">ANDROID 15 UPLOAD - Labels work natively when button click falls, Offscreen inputs fixed -9999px, opacity 0.01. Direct click in same tick, no async.</div>
</div>

<script>
const photoInput = document.getElementById('photoInput');
const previewImg = document.getElementById('previewImg');
const status = document.getElementById('status');
photoInput.addEventListener('change', (e)=>{
 const file = e.target.files[0];
 if(!file) return;
 const url = URL.createObjectURL(file);
 previewImg.src = url;
 status.textContent = `Selected: ${file.name} ${(file.size/1024/1024).toFixed(1)}MB - Ready on Android 15`;
});
</script>
</body>
</html>
