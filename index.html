<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FISSHHFILET</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#080808;color:#f6f1e7;font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}img,video{display:block;max-width:100%}
.display{font-family:Georgia,serif;letter-spacing:.02em}.hidden{display:none!important}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);overflow:auto;padding:20px 12px 40px}
.card{background:#111;border:1px solid rgba(255,255,255,.06);border-radius:22px;overflow:hidden}
.field{width:100%;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:14px 16px;outline:none}
.like.active{color:#e7c35a}
.upload{border:2px dashed rgba(0,0,0,.18);border-radius:20px;padding:25px 15px;text-align:center;background:rgba(0,0,0,.025);position:relative}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.mediaTile{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:#111}
.mediaTile img,.mediaTile video{width:100%;height:100%;object-fit:cover}
.deleteMedia{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);font-size:16px;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111;color:#f6f1e7;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:12px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.25s ease;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.navBtn{width:48px;height:48px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.story{width:72px;flex:0 0 auto;text-align:center}.story img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #e7c35a;margin:0 auto 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 12px;font-size:11px}
.product{background:#111;border:1px solid rgba(255,255,255,.06);border-radius:18px;overflow:hidden}.product img{width:100%;aspect-ratio:1;object-fit:cover}
.gameCard{background:#111;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px}
.linkRow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#ageGate{position:fixed;inset:0;z-index:90;background:#080808;display:flex;align-items:center;justify-content:center;padding:24px}
.progressBar{height:4px;background:rgba(0,0,0,.12);border-radius:999px;overflow:hidden;margin-top:10px}.progressBar>div{height:100%;width:0%;background:#e7c35a;transition:width.2s ease}
</style>
</head>
<body>
<div id="ageGate"><div class="max-w-md w-full text-center"><div class="display text-5xl mb-4">FISSHHFILET</div><p class="opacity-70 text-sm mb-8">This experience is intended for adults 21+.</p><div class="flex gap-3 justify-center"><button onclick="enterHouse()" class="h-12 px-8 rounded-full bg-[#f6f1e7] text-black font-bold text-sm">ENTER</button><button onclick="leaveHouse()" class="h-12 px-8 rounded-full border border-white/15 text-sm">LEAVE</button></div></div></div>
<header class="sticky top-0 z-40 bg-[#080808]/95 backdrop-blur border-b border-white/5"><div class="max-w-[760px] mx-auto px-4 h-16 flex items-center justify-between"><div class="display text-2xl tracking-wide">FISSHHFILET</div><div class="flex gap-2"><button class="navBtn" onclick="openSearch()">⌕</button><button class="navBtn" onclick="openCreate()">＋</button></div></div></header>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pt-5"><div id="stories" class="flex gap-4 overflow-x-auto pb-2"></div></section>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pt-4"><div id="discover" class="flex gap-2 overflow-x-auto pb-1"></div></section>
<section id="feed" class="max-w-[760px] mx-auto px-3 md:px-5 py-6 space-y-6"></section>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pb-8"><div class="display text-2xl mb-4">OBJECTS</div><div id="products" class="grid grid-cols-2 gap-3"></div></section>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pb-8"><div class="display text-2xl mb-4">TONIGHT</div><div id="games" class="space-y-3"></div></section>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pb-10"><div class="display text-2xl mb-2">LINKS</div><div id="links"></div></section>
<section class="max-w-[760px] mx-auto px-3 md:px-5 pb-16 hidden" id="vaultSection"><div class="display text-2xl mb-2">PRIVATE VAULT</div><div id="vaultGrid" class="grid grid-cols-2 gap-3 mt-5"></div></section>
<div id="createModal" class="modal hidden"><div class="max-w-[760px] mx-auto bg-[#f6f1e7] text-black rounded-[28px] p-5 md:p-8"><div class="flex justify-between items-center mb-6"><h2 class="display text-3xl">CREATE</h2><button onclick="closeCreate()" class="w-10 h-10 rounded-full border border-black/15">✕</button></div><div class="upload"><div class="display text-2xl">ADD MEDIA</div><p class="text-xs opacity-55 mt-2 mb-5">Photos, galleries and videos</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="border border-black/10 rounded-2xl p-5 cursor-pointer relative"><input id="photoInput" type="file" accept="image/*" multiple><b class="text-xs">UPLOAD PHOTOS</b><div class="text-[10px] opacity-50 mt-1">Up to 100 photos per batch</div></label><label class="border border-black/10 rounded-2xl p-5 cursor-pointer relative"><input id="videoInput" type="file" accept="video/*" multiple><b class="text-xs">UPLOAD VIDEOS</b><div class="text-[10px] opacity-50 mt-1">Up to 20 videos per batch</div></label></div></div><div id="uploadStats" class="text-xs opacity-55 mt-4"></div><div id="uploadProgress" class="progressBar hidden"><div></div></div><div id="previewGrid" class="grid grid-cols-3 gap-3 mt-4"></div><textarea id="captionInput" class="field mt-5 min-h-[120px]" placeholder="Write your caption..."></textarea><input id="creatorInput" class="field mt-3" placeholder="Creator / username"><input id="categoryInput" class="field mt-3" placeholder="Category"><button id="publishBtn" onclick="publishPost()" class="w-full h-14 rounded-full bg-black text-white display mt-5">PUBLISH</button><div class="border-t border-black/10 mt-8 pt-6"><div class="text-[10px] tracking-[.25em] font-bold">PRIVATE VAULT • 21+</div><label class="upload block mt-3 cursor-pointer relative"><input id="adultInput" type="file" accept="image/*,video/*" multiple><b class="text-xs">ADD AGE-RESTRICTED MEDIA</b></label><div id="vaultGridModal" class="grid grid-cols-3 gap-3 mt-4"></div></div></div></div>
<div id="searchModal" class="modal hidden"><div class="max-w-[700px] mx-auto bg-[#f6f1e7] text-black rounded-[28px] p-6"><div class="flex justify-between items-center mb-5"><h2 class="display text-3xl">SEARCH</h2><button onclick="closeSearch()" class="w-10 h-10 rounded-full border border-black/15">✕</button></div><input id="searchInput" class="field" placeholder="Search captions, creators, categories..." oninput="runSearch(this.value)"><div id="searchResults" class="mt-5 space-y-3"></div></div></div>
<div id="toast"></div>
<script>
const APP_KEY="fisshhfilet_house_data_v6";const MEDIA_DB_NAME="fisshhfilet_media_v1";const MEDIA_STORE="blobs";const WRITE_CONCURRENCY=5;const PREVIEW_BATCH=18;
const defaultData={posts:[],vault:[],products:[{name:"ARCHIVE TOTE",category:"OBJECT",image:"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=800&q=80",link:"https://www.farfetch.com"},{name:"EDITORIAL SUNGLASSES",category:"STYLE",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800&q=80",link:"https://www.farfetch.com"},{name:"STUDIO CHAIR",category:"HOME",image:"https://images.unsplash.com/photo-1503602642458-232111445657?w=800&q=80",link:"https://www.sothebys.com"},{name:"TRAVEL OBJECT",category:"TRAVEL",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80",link:"https://www.farfetch.com"}],games:[{question:"Will outdoor dining stay popular through winter?",options:["YES","NO"]},{question:"Will a new cultural hotspot appear downtown?",options:["YES","NO"]},{question:"Will short-form video dominate tonight?",options:["YES","NO"]}],links:[["GUCCI","https://www.gucci.com"],["PRADA","https://www.prada.com"],["LOUIS VUITTON","https://www.louisvuitton.com"],["HERMES","https://www.hermes.com"],["FARFETCH","https://www.farfetch.com"],["SOTHEBYS","https://www.sothebys.com"],["WHOLE FOODS","https://www.wholefoodsmarket.com"],["SPOTIFY","https://open.spotify.com"],["YOUTUBE","https://www.youtube.com"],["PINTEREST","https://www.pinterest.com"],["INSTAGRAM","https://www.instagram.com"],["TIKTOK","https://www.tiktok.com"],["X","https://x.com"]]};
let data=null;let stagedFiles=[];let previewRenderedCount=0;const urlCache=new Map();
const MediaDB={db:null,open(){return new Promise((resolve,reject)=>{if(this.db)return resolve(this.db);const req=indexedDB.open(MEDIA_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE,{keyPath:"id"})};req.onsuccess=()=>{this.db=req.result;resolve(this.db)};req.onerror=()=>reject(req.error)})},async put(id,blob,meta={}){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");tx.objectStore(MEDIA_STORE).put({id,blob,type:meta.type||blob.type||"application/octet-stream",name:meta.name||"",created:Date.now()});tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})},async get(id){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readonly");const req=tx.objectStore(MEDIA_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})},async delete(id){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");tx.objectStore(MEDIA_STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})},async deleteMany(ids){if(!ids||!ids.length)return;const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");const store=tx.objectStore(MEDIA_STORE);ids.forEach(id=>store.delete(id));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}};
async function resolveMediaUrl(mediaId){if(!mediaId)return"";if(urlCache.has(mediaId))return urlCache.get(mediaId);try{const row=await MediaDB.get(mediaId);if(!row||!row.blob)return"";const url=URL.createObjectURL(row.blob);urlCache.set(mediaId,url);return url}catch(e){return""}}
function revokeMediaUrl(mediaId){if(urlCache.has(mediaId)){URL.revokeObjectURL(urlCache.get(mediaId));urlCache.delete(mediaId)}}
async function writeBlobsBatched(items,onProgress){const queue=items.slice();let done=0;const total=items.length;const workers=[];async function worker(){while(queue.length){const item=queue.shift();try{await MediaDB.put(item.id,item.file||item.blob,{type:item.type,name:item.name})}catch(e){}done++;if(onProgress)onProgress(done,total)}}const n=Math.min(WRITE_CONCURRENCY,Math.max(1,total));for(let i=0;i<n;i++)workers.push(worker());await Promise.all(workers)}
function loadData(){try{const saved=localStorage.getItem(APP_KEY);if(saved){const parsed=JSON.parse(saved);return{...structuredClone(defaultData),...parsed}}}catch(e){}return structuredClone(defaultData)}
function saveData(){try{const clean=structuredClone(data);(clean.posts||[]).forEach(p=>{(p.media||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url})});(clean.vault||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url});localStorage.setItem(APP_KEY,JSON.stringify(clean))}catch(e){toast("Storage limit reached.")}}
function enterHouse(){localStorage.setItem("age_verified","21");document.getElementById("ageGate").classList.add("hidden");toast("Welcome to FISSHHFILET.")}function leaveHouse(){location.href="https://www.google.com"}if(localStorage.getItem("age_verified")==="21"){document.getElementById("ageGate").classList.add("hidden")}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.classList.remove("show")},2200)}
function escapeHTML(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
const storyImages=["https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200&q=80","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=200&q=80","https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80","https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=200&q=80","https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&q=80"];
function renderStories(){document.getElementById("stories").innerHTML=storyImages.map((image,i)=>'<div class="story"><img src="'+image+'" loading="lazy"><div class="text-[10px] opacity-60">S'+(i+1)+'</div></div>').join("")}
function renderDiscover(){const chips=["ALL","STYLE","HOME","TRAVEL","OBJECT","DISCOVERY"];document.getElementById("discover").innerHTML=chips.map(c=>'<button class="chip" onclick="toast(\''+c+'\')">'+c+'</button>').join("")}
function renderProducts(){document.getElementById("products").innerHTML=data.products.map(p=>'<a class="product" href="'+p.link+'" target="_blank"><img src="'+p.image+'" loading="lazy"><div class="p-3"><div class="text-[10px] opacity-50">'+escapeHTML(p.category)+'</div><div class="text-xs mt-1">'+escapeHTML(p.name)+'</div></div></a>').join("")}
function renderGames(){document.getElementById("games").innerHTML=data.games.map(g=>'<div class="gameCard"><div class="text-sm mb-3">'+escapeHTML(g.question)+'</div><div class="flex gap-2">'+g.options.map(o=>'<button class="chip" onclick="toast(\''+o+'\')">'+o+'</button>').join("")+'</div></div>').join("")}
function renderLinks(){document.getElementById("links").innerHTML=data.links.map(pair=>'<a class="linkRow" href="'+pair[1]+'" target="_blank"><span class="text-xs tracking-wide">'+escapeHTML(pair[0])+'</span><span class="opacity-40 text-xs">↗</span></a>').join("")}
function openCreate(){document.getElementById("createModal").classList.remove("hidden")}function closeCreate(){document.getElementById("createModal").classList.add("hidden")}
function handleFiles(files){const incoming=Array.from(files||[]);let photos=stagedFiles.filter(f=>f.type.startsWith("image/")).length;let videos=stagedFiles.filter(f=>f.type.startsWith("video/")).length;for(const file of incoming){if(file.type.startsWith("image/")&&photos>=100){toast("Photo batch limit reached.");break}if(file.type.startsWith("video/")&&videos>=20){toast("Video batch limit reached.");break}const id=crypto.randomUUID();stagedFiles.push({id,file,type:file.type,name:file.name});if(file.type.startsWith("image/"))photos++;else if(file.type.startsWith("video/"))videos++}previewRenderedCount=0;renderPreviewProgressive(true)}
function renderPreviewProgressive(reset){const grid=document.getElementById("previewGrid");if(reset){grid.innerHTML="";previewRenderedCount=0}const start=previewRenderedCount;const end=Math.min(stagedFiles.length,start+PREVIEW_BATCH);const slice=stagedFiles.slice(start,end);slice.forEach(item=>{const tile=document.createElement("div");tile.className="mediaTile";tile.dataset.id=item.id;const url=URL.createObjectURL(item.file);item._tempUrl=url;if(item.type.startsWith("image/")){tile.innerHTML='<img src="'+url+'" loading="lazy"><button class="deleteMedia" onclick="removeStaged(\''+item.id+'\')">×</button>'}else{tile.innerHTML='<video src="'+url+'" muted playsinline preload="metadata"></video><button class="deleteMedia" onclick="removeStaged(\''+item.id+'\')">×</button>'}grid.appendChild(tile)});previewRenderedCount=end;const photos=stagedFiles.filter(x=>x.type.startsWith("image/")).length;const videos=stagedFiles.filter(x=>x.type.startsWith("video/")).length;document.getElementById("uploadStats").textContent=photos+" photos • "+videos+" videos selected"+(previewRenderedCount<stagedFiles.length?" • showing "+previewRenderedCount+"/"+stagedFiles.length:"");if(previewRenderedCount<stagedFiles.length){requestAnimationFrame(()=>renderPreviewProgressive(false))}}
function removeStaged(id){const idx=stagedFiles.findIndex(x=>x.id===id);if(idx===-1)return;const item=stagedFiles[idx];if(item._tempUrl){URL.revokeObjectURL(item._tempUrl);item._tempUrl=null}stagedFiles.splice(idx,1);previewRenderedCount=0;renderPreviewProgressive(true)}
async function publishPost(){if(!stagedFiles.length){toast("Add at least one photo or video.");return}const caption=document.getElementById("captionInput").value.trim()||"New discovery.";const creator=document.getElementById("creatorInput").value.trim()||"CREATOR";const category=document.getElementById("categoryInput").value.trim()||"DISCOVERY";const btn=document.getElementById("publishBtn");const progressEl=document.getElementById("uploadProgress");const bar=progressEl.querySelector("div");btn.disabled=true;btn.textContent="SAVING…";progressEl.classList.remove("hidden");bar.style.width="0%";const mediaMeta=stagedFiles.map(x=>({id:x.id,type:x.type,name:x.name}));try{await writeBlobsBatched(stagedFiles,(done,total)=>{bar.style.width=Math.round((done/total)*100)+"%"});const post={id:crypto.randomUUID(),caption,creator,category,created:Date.now(),media:mediaMeta};data.posts.unshift(post);saveData();await insertPost(post,true);stagedFiles.forEach(x=>{if(x._tempUrl)URL.revokeObjectURL(x._tempUrl)});stagedFiles=[];previewRenderedCount=0;document.getElementById("previewGrid").innerHTML="";document.getElementById("uploadStats").textContent="";document.getElementById("captionInput").value="";document.getElementById("creatorInput").value="";document.getElementById("categoryInput").value="";closeCreate();toast("Published to FISSHHFILET.");window.scrollTo({top:0,behavior:"smooth"})}catch(e){console.error(e);toast("Publish failed.")}finally{btn.disabled=false;btn.textContent="PUBLISH";progressEl.classList.add("hidden");bar.style.width="0%"}}
async function insertPost(post,prepend=false){const article=document.createElement("article");article.className="card";article.dataset.postId=post.id;const first=post.media&&post.media[0];let mediaHtml='<div class="w-full aspect-[4/5] bg-black"></div>';if(first){const url=await resolveMediaUrl(first.id);if(first.type&&first.type.startsWith("video/")){mediaHtml='<video src="'+url+'" class="w-full aspect-[4/5] object-cover" controls playsinline loop muted preload="metadata"></video>'}else{mediaHtml='<img src="'+url+'" class="w-full aspect-[4/5] object-cover" loading="lazy">'}}article.innerHTML='<div class="relative bg-black">'+mediaHtml+'<div class="absolute top-4 left-4"><span class="bg-black/75 text-white rounded-full px-3 py-2 text-[9px]">'+escapeHTML(post.category)+'</span></div></div><div class="p-5"><div class="flex justify-between items-center mb-3"><b class="text-xs">'+escapeHTML(post.creator)+'</b><span class="text-[9px] opacity-40">JUST NOW</span></div><p class="text-[15px] leading-6">'+escapeHTML(post.caption)+'</p><div class="flex gap-2 mt-5"><button onclick="toggleLike(this)" class="like w-10 h-10 rounded-full bg-black/10">♡</button><button onclick="sharePost()" class="w-10 h-10 rounded-full bg-black/10">↗</button><button onclick="deletePost(\''+post.id+'\',this)" class="ml-auto w-10 h-10 rounded-full bg-black/10">🗑</button></div></div>';const feed=document.getElementById("feed");if(prepend)feed.insertBefore(article,feed.firstChild);else feed.appendChild(article)}
async function renderSavedPosts(){for(const post of data.posts){await insertPost(post,false)}}
async function deletePost(id,button){if(!confirm("Delete this post?"))return;const post=data.posts.find(p=>p.id===id);data.posts=data.posts.filter(p=>p.id!==id);saveData();if(post&&post.media){const ids=post.media.map(m=>m.id).filter(Boolean);ids.forEach(revokeMediaUrl);try{await MediaDB.deleteMany(ids)}catch(e){}}if(button)button.closest("article").remove();toast("Post deleted.")}
document.getElementById("adultInput").addEventListener("change",async function(e){const files=Array.from(e.target.files||[]);e.target.value="";if(!files.length)return;toast("Saving to vault…");const items=files.map(file=>({id:crypto.randomUUID(),file,type:file.type,name:file.name}));try{await writeBlobsBatched(items);items.forEach(item=>{data.vault.push({id:item.id,type:item.type,name:item.name})});saveData();renderVault();toast("Added to private vault.")}catch(err){toast("Vault save failed.")}});
async function renderVault(){const grid=document.getElementById("vaultGrid");if(!grid)return;grid.innerHTML="";const batch=24;let i=0;async function next(){const slice=data.vault.slice(i,i+batch);for(const item of slice){const url=await resolveMediaUrl(item.id);const tile=document.createElement("div");tile.className="mediaTile";if(item.type&&item.type.startsWith("video/")){tile.innerHTML='<video src="'+url+'" controls preload="metadata"></video>'}else{tile.innerHTML='<img src="'+url+'" loading="lazy">'}grid.appendChild(tile)}i+=batch;if(i<data.vault.length)requestAnimationFrame(next)}next()}
document.getElementById("photoInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});document.getElementById("videoInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});
const uploadArea=document.querySelector(".upload");["dragenter","dragover"].forEach(n=>{uploadArea.addEventListener(n,e=>{e.preventDefault();uploadArea.style.borderColor="#e7c35a"})});["dragleave","drop"].forEach(n=>{uploadArea.addEventListener(n,e=>{e.preventDefault();uploadArea.style.borderColor=""})});uploadArea.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files)});
(async function init(){data=loadData();(data.posts||[]).forEach(p=>{(p.media||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url})});(data.vault||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url});try{await MediaDB.open()}catch(e){toast("Local media storage unavailable.")}renderStories();renderDiscover();renderProducts();renderGames();renderLinks();await renderVault();await renderSavedPosts()})();
</script>
</body>
