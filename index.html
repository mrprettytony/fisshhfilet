<script>
const APP_KEY="fisshhfilet_house_data_v6";
const MEDIA_DB_NAME="fisshhfilet_media_v1";
const MEDIA_STORE="blobs";
const PREVIEW_BATCH=6;
const THUMB_MAX=320;
const THUMB_QUALITY=0.7;
const PHOTO_CAP=100;
const VIDEO_CAP=20;
const defaultData={posts:[],vault:[],products:[{name:"ARCHIVE TOTE",category:"OBJECT",image:"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=800&q=80",link:"https://www.farfetch.com"},{name:"EDITORIAL SUNGLASSES",category:"STYLE",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800&q=80",link:"https://www.farfetch.com"},{name:"STUDIO CHAIR",category:"HOME",image:"https://images.unsplash.com/photo-1503602642458-232111445657?w=800&q=80",link:"https://www.sothebys.com"},{name:"TRAVEL OBJECT",category:"TRAVEL",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80",link:"https://www.farfetch.com"}],games:[{question:"Will outdoor dining stay popular through winter?",options:["YES","NO"]},{question:"Will a new cultural hotspot appear downtown?",options:["YES","NO"]},{question:"Will short-form video dominate tonight?",options:["YES","NO"]}],links:[["GUCCI","https://www.gucci.com"],["PRADA","https://www.prada.com"],["LOUIS VUITTON","https://www.louisvuitton.com"],["HERMES","https://www.hermes.com"],["FARFETCH","https://www.farfetch.com"],["SOTHEBYS","https://www.sothebys.com"],["WHOLE FOODS","https://www.wholefoodsmarket.com"],["SPOTIFY","https://open.spotify.com"],["YOUTUBE","https://www.youtube.com"],["PINTEREST","https://www.pinterest.com"],["INSTAGRAM","https://www.instagram.com"],["TIKTOK","https://www.tiktok.com"],["X","https://x.com"]]};
let data=null;
let stagedFiles=[];
let previewRenderedCount=0;
let ingestBusy=false;
const thumbUrlCache=new Map();
const originalUrlCache=new Map();
function isAndroid(){return /Android/i.test(navigator.userAgent||"");}
function yieldMain(){return new Promise(function(r){requestAnimationFrame(function(){setTimeout(r,0);});});}
function isQuota(err){if(!err)return false;const n=err.name||"";return n==="QuotaExceededError"||n==="NS_ERROR_DOM_QUOTA_REACHED"||/quota/i.test(String(err.message||err));}
const MediaDB={
 db:null,
 open(){
  return new Promise((resolve,reject)=>{
   if(this.db)return resolve(this.db);
   const req=indexedDB.open(MEDIA_DB_NAME,1);
   req.onupgradeneeded=()=>{
    const db=req.result;
    if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE,{keyPath:"id"});
   };
   req.onsuccess=()=>{this.db=req.result;resolve(this.db);};
   req.onerror=()=>reject(req.error);
  });
 },
 async put(id,blob,meta={}){
  const db=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readwrite");
   tx.objectStore(MEDIA_STORE).put({
    id,
    blob,
    thumb:meta.thumb||null,
    type:meta.type||blob.type||"application/octet-stream",
    name:meta.name||"",
    created:Date.now()
   });
   tx.oncomplete=()=>resolve();
   tx.onabort=()=>reject(tx.error||new Error("idb-abort"));
   tx.onerror=()=>reject(tx.error);
  });
 },
 async get(id){
  const db=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readonly");
   const req=tx.objectStore(MEDIA_STORE).get(id);
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>reject(req.error);
  });
 },
 async delete(id){
  const db=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readwrite");
   tx.objectStore(MEDIA_STORE).delete(id);
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
  });
 },
 async deleteMany(ids){
  if(!ids||!ids.length)return;
  const db=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readwrite");
   const store=tx.objectStore(MEDIA_STORE);
   ids.forEach(id=>store.delete(id));
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
  });
 },
 async clearAll(){
  const db=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readwrite");
   tx.objectStore(MEDIA_STORE).clear();
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
  });
 }
};
async function requestPersist(){
 if(!navigator.storage||!navigator.storage.persist)return false;
 try{return await navigator.storage.persist();}catch(e){return false;}
}
function revokeThumb(id){
 if(thumbUrlCache.has(id)){URL.revokeObjectURL(thumbUrlCache.get(id));thumbUrlCache.delete(id);}
}
function revokeOriginal(id){
 if(originalUrlCache.has(id)){URL.revokeObjectURL(originalUrlCache.get(id));originalUrlCache.delete(id);}
}
async function resolveThumbUrl(mediaId){
 if(!mediaId)return"";
 if(thumbUrlCache.has(mediaId))return thumbUrlCache.get(mediaId);
 try{
  const row=await MediaDB.get(mediaId);
  if(!row)return"";
  if(row.thumb){
   const url=URL.createObjectURL(row.thumb);
   thumbUrlCache.set(mediaId,url);
   return url;
  }
  if(row.type&&row.type.startsWith("video/"))return"";
  if(!row.blob)return"";
  const url=URL.createObjectURL(row.blob);
  thumbUrlCache.set(mediaId,url);
  return url;
 }catch(e){return"";}
}
async function resolveMediaUrl(mediaId){
 if(!mediaId)return"";
 if(originalUrlCache.has(mediaId))return originalUrlCache.get(mediaId);
 try{
  const row=await MediaDB.get(mediaId);
  if(!row||!row.blob)return"";
  const url=URL.createObjectURL(row.blob);
  originalUrlCache.set(mediaId,url);
  return url;
 }catch(e){return"";}
}
function canvasToJpeg(canvas){
 return new Promise(function(resolve,reject){
  if(!canvas.toBlob){
   try{
    const dataUrl=canvas.toDataURL("image/jpeg",THUMB_QUALITY);
    const bstr=atob(dataUrl.split(",")[1]);
    const u8=new Uint8Array(bstr.length);
    for(let i=0;i<bstr.length;i++)u8[i]=bstr.charCodeAt(i);
    resolve(new Blob([u8],{type:"image/jpeg"}));
   }catch(err){reject(err);}
   return;
  }
  canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error("thumb"));},"image/jpeg",THUMB_QUALITY);
 });
}
async function makeImageThumb(file){
 let bmp=null;
 try{
  if(typeof createImageBitmap==="function"){
   try{bmp=await createImageBitmap(file,{resizeWidth:THUMB_MAX,resizeHeight:THUMB_MAX,resizeQuality:"low"});}
   catch(e){bmp=await createImageBitmap(file);}
   const w=bmp.width,h=bmp.height;
   const scale=Math.min(1,THUMB_MAX/Math.max(w,h));
   const tw=Math.max(1,Math.round(w*scale));
   const th=Math.max(1,Math.round(h*scale));
   const canvas=document.createElement("canvas");
   canvas.width=tw;canvas.height=th;
   canvas.getContext("2d",{alpha:false}).drawImage(bmp,0,0,tw,th);
   const blob=await canvasToJpeg(canvas);
   bmp.close();canvas.width=0;canvas.height=0;
   return blob;
  }
 }catch(e){if(bmp&&bmp.close)try{bmp.close();}catch(x){}}
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise(function(res,rej){const el=new Image();el.onload=()=>res(el);el.onerror=()=>rej(new Error("decode"));el.src=url;});
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const scale=Math.min(1,THUMB_MAX/Math.max(w,h));
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(w*scale));
  canvas.height=Math.max(1,Math.round(h*scale));
  canvas.getContext("2d",{alpha:false}).drawImage(img,0,0,canvas.width,canvas.height);
  img.src="";
  const blob=await canvasToJpeg(canvas);
  canvas.width=0;canvas.height=0;
  return blob;
 }finally{URL.revokeObjectURL(url);}
}
async function makeVideoThumb(file){
 const url=URL.createObjectURL(file);
 const video=document.createElement("video");
 video.muted=true;video.playsInline=true;video.preload="metadata";
 video.setAttribute("playsinline","");
 try{
  await new Promise(function(res,rej){
   const t=setTimeout(()=>rej(new Error("video-meta")),8000);
   video.onloadedmetadata=()=>{clearTimeout(t);res();};
   video.onerror=()=>{clearTimeout(t);rej(new Error("video-load"));};
   video.src=url;
  });
  try{
   video.currentTime=Math.min(0.35,isFinite(video.duration)?video.duration*0.1:0.1);
   await new Promise(function(res){
    const t=setTimeout(res,2500);
    video.onseeked=()=>{clearTimeout(t);res();};
   });
  }catch(e){}
  const w=video.videoWidth||0,h=video.videoHeight||0;
  if(!w||!h)return null;
  const scale=Math.min(1,THUMB_MAX/Math.max(w,h));
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(w*scale));
  canvas.height=Math.max(1,Math.round(h*scale));
  canvas.getContext("2d",{alpha:false}).drawImage(video,0,0,canvas.width,canvas.height);
  const blob=await canvasToJpeg(canvas);
  canvas.width=0;canvas.height=0;
  video.pause();video.removeAttribute("src");video.load();
  return blob;
 }catch(e){return null;}
 finally{URL.revokeObjectURL(url);}
}
async function makeThumb(item){
 if(item._thumbBlob)return item._thumbBlob;
 try{
  item._thumbBlob=item.type.startsWith("video/")?await makeVideoThumb(item.file):await makeImageThumb(item.file);
 }catch(e){item._thumbBlob=null;}
 await yieldMain();
 return item._thumbBlob;
}
async function writeBlobsSequential(items,onProgress){
 const saved=[];
 const failed=[];
 for(let i=0;i<items.length;i++){
  const item=items[i];
  if(onProgress)onProgress(i,items.length,item.name||"");
  if(item.file&&item.file.size>100*1024*1024){
   failed.push({name:item.name,reason:"File over 100MB"});
   continue;
  }
  try{
   const thumb=await makeThumb(item);
   await MediaDB.put(item.id,item.file||item.blob,{type:item.type,name:item.name,thumb:thumb||null});
   saved.push(item);
  }catch(e){
   const reason=isQuota(e)?"Storage quota exceeded":(e&&e.message)||"Save failed";
   failed.push({name:item.name,reason:reason});
   if(isQuota(e)){
    for(let r=i+1;r<items.length;r++)failed.push({name:items[r].name,reason:"Stopped — storage quota"});
    break;
   }
  }
  await yieldMain();
 }
 if(onProgress)onProgress(items.length,items.length,"");
 return {saved,failed};
}
function loadData(){
 try{
  const saved=localStorage.getItem(APP_KEY);
  if(saved){const parsed=JSON.parse(saved);return{...structuredClone(defaultData),...parsed};}
 }catch(e){}
 return structuredClone(defaultData);
}
function saveData(){
 try{
  const clean=structuredClone(data);
  (clean.posts||[]).forEach(p=>{(p.media||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url;});});
  (clean.vault||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url;});
  localStorage.setItem(APP_KEY,JSON.stringify(clean));
  return true;
 }catch(e){toast("Catalog storage limit reached.");return false;}
}

 localStorage.setItem("age_verified","21");
 document.getElementById("ageGate").classList.add("hidden");

 toast("Welcome to FISSHHFILET.");
}

function escapeHTML(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function handleFiles(files){
 const incoming=Array.from(files||[]);
 let photos=stagedFiles.filter(f=>f.type.startsWith("image/")).length;
 let videos=stagedFiles.filter(f=>f.type.startsWith("video/")).length;
 const rejected=[];
 for(const file of incoming){
  if(file.size>100*1024*1024){rejected.push(file.name+" over 100MB");continue;}
  if(file.type.startsWith("image/")&&photos>=PHOTO_CAP){rejected.push("Photo batch cap "+PHOTO_CAP);break;}
  if(file.type.startsWith("video/")&&videos>=VIDEO_CAP){rejected.push("Video batch cap "+VIDEO_CAP);break;}
  if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){rejected.push(file.name+" unsupported");continue;}
  stagedFiles.push({id:crypto.randomUUID(),file,type:file.type,name:file.name,_thumbBlob:null});
  if(file.type.startsWith("image/"))photos++;else videos++;
 }
 if(rejected.length)toast(rejected[0]);
 previewRenderedCount=0;
 await renderPreviewProgressive(true);
}
async function renderPreviewProgressive(reset){
 const grid=document.getElementById("previewGrid");
 if(reset){grid.innerHTML="";previewRenderedCount=0;}
 const start=previewRenderedCount;
 const end=Math.min(stagedFiles.length,start+PREVIEW_BATCH);
 for(let i=start;i<end;i++){
  const item=stagedFiles[i];
  const tile=document.createElement("div");
  tile.className="mediaTile";
  tile.dataset.id=item.id;
  const isVid=item.type.startsWith("video/");
  tile.innerHTML=(isVid?'<div style="width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;color:#f6f1e7;font-size:10px;letter-spacing:.2em">VIDEO</div>':'<div style="width:100%;height:100%;background:#ddd"></div>')+'<button class="deleteMedia" onclick="removeStaged(\''+item.id+'\')">×</button>';
  grid.appendChild(tile);
  try{
   const thumb=await makeThumb(item);
   if(thumb){
    if(item._tempUrl)URL.revokeObjectURL(item._tempUrl);
    const url=URL.createObjectURL(thumb);
    item._tempUrl=url;
    const img=document.createElement("img");
    img.src=url;img.loading="lazy";
    tile.insertBefore(img,tile.firstChild);
    const ph=tile.querySelector("div");
    if(ph)ph.remove();
   }
  }catch(e){}
  await yieldMain();
 }
 previewRenderedCount=end;
 const photos=stagedFiles.filter(x=>x.type.startsWith("image/")).length;
 const videos=stagedFiles.filter(x=>x.type.startsWith("video/")).length;
 document.getElementById("uploadStats").textContent=photos+" photos • "+videos+" videos selected"+(previewRenderedCount<stagedFiles.length?" • thumbs "+previewRenderedCount+"/"+stagedFiles.length:"")+(isAndroid()?" • Android sequential":"");
 if(previewRenderedCount<stagedFiles.length)requestAnimationFrame(()=>renderPreviewProgressive(false));
}
function removeStaged(id){
 const idx=stagedFiles.findIndex(x=>x.id===id);
 if(idx===-1)return;
 const item=stagedFiles[idx];
 if(item._tempUrl){URL.revokeObjectURL(item._tempUrl);item._tempUrl=null;}
 stagedFiles.splice(idx,1);
 previewRenderedCount=0;
 renderPreviewProgressive(true);
}
async function publishPost(){
 if(ingestBusy)return;
 if(!stagedFiles.length){toast("Add at least one photo or video.");return;}
 const caption=document.getElementById("captionInput").value.trim()||"New discovery.";
 const creator=document.getElementById("creatorInput").value.trim()||"CREATOR";
 const category=document.getElementById("categoryInput").value.trim()||"DISCOVERY";
 const btn=document.getElementById("publishBtn");
 const progressEl=document.getElementById("uploadProgress");
 const bar=progressEl.querySelector("div");
 ingestBusy=true;
 btn.disabled=true;btn.textContent="SAVING…";
 progressEl.classList.remove("hidden");bar.style.width="0%";
 await requestPersist();
 try{
  const result=await writeBlobsSequential(stagedFiles,function(done,total,name){
   bar.style.width=Math.round((done/Math.max(total,1))*100)+"%";
   if(name)btn.textContent="SAVING "+done+"/"+total;
  });
  if(!result.saved.length){
   toast(result.failed[0]?result.failed[0].reason:"Nothing saved.");
   return;
  }
  const mediaMeta=result.saved.map(x=>({id:x.id,type:x.type,name:x.name}));
  const post={id:crypto.randomUUID(),caption,creator,category,created:Date.now(),media:mediaMeta};
  data.posts.unshift(post);
  if(!saveData()){
   toast("Saved files, but catalog write failed. Reloading may hide the post card.");
  }
  await insertPost(post,true);
  stagedFiles.forEach(x=>{if(x._tempUrl)URL.revokeObjectURL(x._tempUrl);});
  stagedFiles=[];previewRenderedCount=0;
  document.getElementById("previewGrid").innerHTML="";
  document.getElementById("uploadStats").textContent=result.failed.length?result.failed.length+" file(s) not saved":"";
  document.getElementById("captionInput").value="";
  document.getElementById("creatorInput").value="";
  document.getElementById("categoryInput").value="";
  closeCreate();
  toast(result.failed.length?"Published with "+result.failed.length+" skipped.":"Published to FISSHHFILET.");
  window.scrollTo({top:0,behavior:"smooth"});
 }catch(e){
  console.error(e);
  toast("Publish failed.");
 }finally{
  ingestBusy=false;
  btn.disabled=false;btn.textContent="PUBLISH";
  progressEl.classList.add("hidden");bar.style.width="0%";
 }
}
async function insertPost(post,prepend=false){
 const article=document.createElement("article");
 article.className="card";
 article.dataset.postId=post.id;
 const kinds=(post.media||[]).map(m=>(m.type||"").startsWith("video/")?"video":"image");
 article.dataset.kinds=Array.from(new Set(kinds)).join(",");
 const first=post.media&&post.media[0];
 let mediaHtml='<div class="w-full aspect-[4/5] bg-black"></div>';
 if(first){
  const url=await resolveThumbUrl(first.id);
  const open='onclick="openLightbox(\''+first.id+'\')"';
  if(first.type&&first.type.startsWith("video/")){
   if(url){
    mediaHtml='<img src="'+url+'" class="w-full aspect-[4/5] object-cover" loading="lazy" style="cursor:zoom-in" '+open+'><div class="absolute bottom-4 left-4 text-[10px] tracking-widest">VIDEO</div>';
   }else{
    mediaHtml='<button type="button" class="w-full aspect-[4/5] flex flex-col items-center justify-center bg-black text-[#f6f1e7]" style="cursor:zoom-in" '+open+'><span class="display text-2xl tracking-[.2em]">VIDEO</span><span class="text-[10px] opacity-50 mt-2">TAP TO PLAY</span></button>';
   }
  }else if(url){
   mediaHtml='<img src="'+url+'" class="w-full aspect-[4/5] object-cover" loading="lazy" style="cursor:zoom-in" '+open+'>';
  }else{
   mediaHtml='<button type="button" class="w-full aspect-[4/5] flex items-center justify-center bg-black text-[#f6f1e7] text-[10px] tracking-widest" '+open+'>PHOTO</button>';
  }
 }
 article.innerHTML='<div class="relative bg-black">'+mediaHtml+'<div class="absolute top-4 left-4"><span class="bg-black/75 text-white rounded-full px-3 py-2 text-[9px]">'+escapeHTML(post.category)+'</span></div></div><div class="p-5"><div class="flex justify-between items-center mb-3"><b class="text-xs">'+escapeHTML(post.creator)+'</b><span class="text-[9px] opacity-40">JUST NOW</span></div><p class="text-[15px] leading-6">'+escapeHTML(post.caption)+'</p><div class="flex gap-2 mt-5"><button onclick="toggleLike(this)" class="like w-10 h-10 rounded-full bg-black/10">♡</button><button onclick="sharePost()" class="w-10 h-10 rounded-full bg-black/10">↗</button><button onclick="deletePost(\''+post.id+'\',this)" class="ml-auto w-10 h-10 rounded-full bg-black/10">🗑</button></div></div>';
 const feed=document.getElementById("feed");
 if(prepend)feed.insertBefore(article,feed.firstChild);else feed.appendChild(article);
}
async function renderSavedPosts(){
 const feed=document.getElementById("feed");
 feed.innerHTML="";
 for(const post of data.posts){await insertPost(post,false);await yieldMain();}
}
function toggleLike(btn){btn.classList.toggle("active");btn.textContent=btn.classList.contains("active")?"♥":"♡";}
function sharePost(){toast("Copied to your house.");}
async function deletePost(id,button){
 if(!confirm("Delete this post?"))return;
 const post=data.posts.find(p=>p.id===id);
 data.posts=data.posts.filter(p=>p.id!==id);
 saveData();
 if(post&&post.media){
  const ids=post.media.map(m=>m.id).filter(Boolean);
  ids.forEach(id=>{revokeThumb(id);revokeOriginal(id);});
  try{await MediaDB.deleteMany(ids);}catch(e){}
 }
 if(button)button.closest("article").remove();
 toast("Post deleted.");
}
async function clearArchive(){
 if(!confirm("Clear the entire local archive on this device? This cannot be undone."))return;
 closeLightbox();
 thumbUrlCache.forEach(function(url){URL.revokeObjectURL(url);});
 originalUrlCache.forEach(function(url){URL.revokeObjectURL(url);});
 thumbUrlCache.clear();
 originalUrlCache.clear();
 stagedFiles.forEach(x=>{if(x._tempUrl)URL.revokeObjectURL(x._tempUrl);});
 stagedFiles=[];
 previewRenderedCount=0;
 const grid=document.getElementById("previewGrid");
 if(grid)grid.innerHTML="";
 try{await MediaDB.clearAll();}catch(e){}
 data.posts=[];
 data.vault=[];
 saveData();
 document.getElementById("feed").innerHTML="";
 renderVault();
 renderStories();
 toast("Local archive cleared.");
}
async function openLightbox(mediaId){
 const url=await resolveMediaUrl(mediaId);
 if(!url){toast("Media not found.");return;}
 const lb=document.getElementById("lightbox");
 const img=document.getElementById("lightboxImg");
 const vid=document.getElementById("lightboxVideo");
 const row=await MediaDB.get(mediaId);
 const isVideo=row&&row.type&&row.type.startsWith("video/");
 img.classList.add("hidden");vid.classList.add("hidden");
 if(isVideo){vid.classList.remove("hidden");vid.src=url;}
 else{img.classList.remove("hidden");img.src=url;}
 lb.classList.remove("hidden");
 document.body.style.overflow="hidden";
}
function closeLightbox(){
 const lb=document.getElementById("lightbox");
 const img=document.getElementById("lightboxImg");
 const vid=document.getElementById("lightboxVideo");
 lb.classList.add("hidden");
 img.src="";vid.pause();vid.src="";
 originalUrlCache.forEach(function(url){URL.revokeObjectURL(url);});
 originalUrlCache.clear();
 document.body.style.overflow="";
}
document.getElementById("adultInput").addEventListener("change",async function(e){
 const files=Array.from(e.target.files||[]);
 e.target.value="";
 if(!files.length)return;
 toast("Saving to vault…");
 const items=files.map(file=>({id:crypto.randomUUID(),file,type:file.type,name:file.name}));
 const result=await writeBlobsSequential(items);
 result.saved.forEach(item=>{data.vault.push({id:item.id,type:item.type,name:item.name});});
 saveData();
 renderVault();
 toast(result.failed.length?"Vault saved with "+result.failed.length+" skipped.":"Added to private vault.");
});
async function renderVault(){
 const grids=["vaultGrid","vaultGridModal"].map(function(id){return document.getElementById(id);}).filter(Boolean);
 grids.forEach(function(grid){grid.innerHTML="";});
 for(const item of data.vault){
  const url=await resolveThumbUrl(item.id);
  const isVid=item.type&&item.type.startsWith("video/");
  grids.forEach(function(grid){
   const tile=document.createElement("div");
   tile.className="mediaTile";
   if(url){
    tile.innerHTML='<img src="'+url+'" loading="lazy" style="cursor:zoom-in" onclick="openLightbox(\''+item.id+'\')">';
   }else if(isVid){
    tile.innerHTML='<button type="button" style="width:100%;height:100%;background:#111;color:#f6f1e7;letter-spacing:.2em;font-size:10px" onclick="openLightbox(\''+item.id+'\')">VIDEO</button>';
   }else{
    tile.innerHTML='<button type="button" style="width:100%;height:100%;background:#111;color:#f6f1e7;font-size:10px" onclick="openLightbox(\''+item.id+'\')">PHOTO</button>';
   }
   grid.appendChild(tile);
  });
  await yieldMain();
 }
}
function openSearch(){document.getElementById("searchModal").classList.remove("hidden");document.getElementById("searchInput").focus();}
function closeSearch(){document.getElementById("searchModal").classList.add("hidden");}
function runSearch(q){
 q=String(q||"").toLowerCase().trim();
 const box=document.getElementById("searchResults");
 if(!q){box.innerHTML="";return;}
 const hits=(data.posts||[]).filter(p=>((p.caption||"")+" "+(p.creator||"")+" "+(p.category||"")).toLowerCase().indexOf(q)!==-1);
 box.innerHTML=hits.length?hits.map(p=>'<div class="card p-4 text-black" style="background:#fff"><b class="text-xs">'+escapeHTML(p.creator)+'</b><div class="text-sm mt-1">'+escapeHTML(p.caption)+'</div></div>').join(""):'<div class="text-sm opacity-50">No matches.</div>';
}
document.getElementById("photoInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value="";});
document.getElementById("videoInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value="";});
const uploadArea=document.querySelector(".upload");
["dragenter","dragover"].forEach(n=>{uploadArea.addEventListener(n,e=>{e.preventDefault();uploadArea.style.borderColor="#e7c35a";});});
["dragleave","drop"].forEach(n=>{uploadArea.addEventListener(n,e=>{e.preventDefault();uploadArea.style.borderColor="";});});
uploadArea.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files);});
(async function init(){
 data=loadData();
 (data.posts||[]).forEach(p=>{(p.media||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url;});});
 (data.vault||[]).forEach(m=>{if(m.url&&String(m.url).startsWith("blob:"))delete m.url;});
 try{await MediaDB.open();}catch(e){toast("Local media storage unavailable.");}
 renderStories();renderDiscover();renderProducts();renderGames();renderLinks();
 await renderVault();
 await renderSavedPosts();
})();
</script>
