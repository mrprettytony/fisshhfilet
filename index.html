<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET TRAILERS</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#0a0a0a;color:#fff;font-family:serif;padding:20px}
h1{text-align:center;letter-spacing:6px;margin:20px 0}
.feed{display:grid;gap:16px;max-width:600px;margin:0 auto}
.card{background:#151515;border-radius:12px;overflow:hidden;border:1px solid #222}
.card img,.card video{width:100%;display:block}
.card p{padding:10px;font-family:sans-serif;font-size:13px;color:#aaa}
.btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#D4AF37;color:#000;border:0;padding:18px 40px;border-radius:99px;font-weight:bold;letter-spacing:2px;z-index:50}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:end;z-index:100}
.sheet.open{display:flex}.panel{background:#111;border-radius:24px 24px 0 0;width:100%;padding:24px}
.label{display:block;background:#222;border-radius:99px;padding:20px;text-align:center;margin:10px 0;letter-spacing:2px;font-weight:bold;cursor:pointer}
.label.gold{background:#D4AF37;color:#000}
.label input{position:absolute;left:-9999px;opacity:0.01}
.preview{max-width:600px;margin:20px auto;color:#888;font-size:12px;font-family:sans-serif;text-align:center}
.badge{font-size:10px;background:#D4AF37;color:#000;padding:3px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<h1>FISSHHFILET <span class="badge">TRAILERS 0:04-5:00</span></h1>
<div id="preview" class="preview">Upload trailers 4 sec to 5 min</div>
<div id="feed" class="feed"></div>
<button class="btn" id="open">+ UPLOAD</button>

<div class="sheet" id="sheet">
<div class="panel">
<h2 style="letter-spacing:4px;margin-bottom:6px">Upload Trailer</h2>
<p style="color:#666;font-family:sans-serif;font-size:12px;margin-bottom:18px">Android 16 fixed — 0:04 min 5:00 max</p>

<label class="label gold" for="photoInput">+ UPLOAD PHOTO GALLERY
<input id="photoInput" type="file" accept="image/*" multiple>
</label>

<label class="label" for="videoInput">▷ UPLOAD TRAILER 0:04-5:00
<input id="videoInput" type="file" accept="video/mp4,video/quicktime,video/*">
</label>

<div class="label" style="background:transparent;border:1px solid #333" id="close">CANCEL</div>
<p id="timing" style="color:#D4AF37;font-size:11px;margin-top:14px;text-align:center;font-family:sans-serif">TRAILER RULE: 4 seconds to 5:00</p>
</div>
</div>

<script>
const feed=document.getElementById('feed');
const preview=document.getElementById('preview');
const sheet=document.getElementById('sheet');
document.getElementById('open').onclick=()=>sheet.classList.add('open');
document.getElementById('close').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};

function addCard(url,type,name,dur){
 const d=document.createElement('div');d.className='card';
 if(type.startsWith('image')) d.innerHTML=`<img src="${url}"><p>${name} — POSTER</p>`;
 else d.innerHTML=`<video src="${url}" controls playsinline></video><p>${name} — TRAILER ${dur}s</p>`;
 feed.prepend(d);
}

document.getElementById('photoInput').addEventListener('change',e=>{
 const files=[...e.target.files];
 preview.innerHTML=`Selected ${files.length} posters`;
 files.forEach(f=>{ addCard(URL.createObjectURL(f),f.type,f.name,''); });
 sheet.classList.remove('open');
});

document.getElementById('videoInput').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const url=URL.createObjectURL(f);
 const v=document.createElement('video'); v.preload='metadata'; v.src=url;
 v.onloadedmetadata=()=>{
  const sec=Math.round(v.duration);
  const fmt=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  if(sec<4||sec>300){
    alert(`TRAILER must be 0:04 to 5:00 — yours is ${fmt} (${sec}s)`);
    preview.innerHTML=`❌ ${f.name} is ${fmt} — needs 0:04 to 5:00`;
    return;
  }
  preview.innerHTML=`✅ ${f.name} ${fmt} OK — trailer ready`;
  addCard(url,f.type,f.name,fmt);
  sheet.classList.remove('open');
 };
});
</script>
</body>
</html>
